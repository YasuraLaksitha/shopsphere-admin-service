spring:
  application:
    name: admins
  config:
    import: "optional:configserver:http://localhost:8070/"
  jpa:
    properties:
      hibernate:
        dialect:  org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8071/eureka

springdoc:
  swagger-ui:
    url: /shopsphere/admins/v3/api-docs
    config-url: /shopsphere/admins/v3/api-docs/swagger-config