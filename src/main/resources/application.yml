spring:
  application:
    name: admins
  config:
    import: "optional:configserver:http://localhost:8070/"
  datasource:
    product:
      jdbc-url: jdbc:postgresql://localhost:5439/postgres
      username: user
      password: password
      driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect:  org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      access: unrestricted

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8071/eureka
